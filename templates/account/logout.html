<!DOCTYPE html>
{% load static %}
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الخروج - نظام البنك الحيوي</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        .logout-container {
            width: 100%;
            max-width: 440px;
        }
        .logout-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logout-header {
            background: linear-gradient(135deg, #e53e3e 0%, #c53030 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .logout-header .icon { font-size: 3.5rem; display: block; }
        .logout-header h2 { font-size: 1.8rem; font-weight: 700; }
        .logout-body { padding: 40px 30px; text-align: center; }
        .btn-logout {
            background: linear-gradient(135deg, #e53e3e 0%, #c53030 100%);
            border: none;
            color: white;
            padding: 14px 30px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-logout:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(229, 62, 62, 0.4); color: white; }
        .btn-cancel {
            background: #718096;
            border: none;
            color: white;
            padding: 14px 30px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-cancel:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(113, 128, 150, 0.4); color: white; }
    </style>
</head>
<body>
    <div class="logout-container">
        <div class="logout-card">
            <div class="logout-header">
                <span class="icon"><i class="fas fa-sign-out-alt"></i></span>
                <h2>تسجيل الخروج</h2>
                <p style="opacity:0.85;">هل أنت متأكد من رغبتك في تسجيل الخروج؟</p>
            </div>
            <div class="logout-body">
                <form method="post" action="{% url 'account_logout' %}">
                    {% csrf_token %}
                    {% if redirect_field_value %}
                        <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}" />
                    {% endif %}
                    <button type="submit" class="btn-logout">
                        <i class="fas fa-sign-out-alt me-2"></i> تسجيل الخروج
                    </button>
                    <a href="/" class="btn-cancel">
                        <i class="fas fa-times me-2"></i> إلغاء
                    </a>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

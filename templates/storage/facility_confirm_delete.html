{% extends 'base/base.html' %}
{% load static %}

{% block title %}حذف مرفق - نظام البنك الحيوي{% endblock %}

{% block content %}
<div class="mb-3">
    <h2><i class="fas fa-trash text-danger"></i> حذف المرفق</h2>
    <hr>
</div>

<div class="alert alert-danger">
    <i class="fas fa-exclamation-triangle"></i>
    هل أنت متأكد من حذف المرفق <strong>{{ facility.name }}</strong>؟
    <br>
    <small>الرمز: {{ facility.code }}</small>
</div>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">
        <i class="fas fa-trash"></i> تأكيد الحذف
    </button>
    <a href="{% url 'storage_list' %}" class="btn btn-secondary">
        <i class="fas fa-times"></i> إلغاء
    </a>
</form>
{% endblock %}
